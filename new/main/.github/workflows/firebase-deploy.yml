name: Firebase Deploy
on:
  push:
    branches: [main]
    paths: ['web/**', 'firebase/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g firebase-tools
      - name: Functions deps
        run: cd firebase/functions && npm install
      - name: Service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/sa.json
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/sa.json
        run: firebase deploy --only hosting,database,functions --project itemshop-52277 --config firebase/firebase.json
